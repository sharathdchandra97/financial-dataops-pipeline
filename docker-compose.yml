version: '3.9'

services:
  # ─────────────────────────────────────────────────────────────────
  # DataOps Pipeline
  # ─────────────────────────────────────────────────────────────────
  pipeline:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: dataops-pipeline
    environment:
      - DATABASE_URL=postgresql://dataops:dataops@postgres:5432/dataops
      - VAULT_ADDR=http://vault:8200
      - VAULT_TOKEN=${VAULT_TOKEN:-root}
      - PUSHGATEWAY_URL=http://pushgateway:9091
    volumes:
      - ./data:/app/data
      - ./output:/app/output
    depends_on:
      postgres:
        condition: service_healthy
      vault:
        condition: service_started
    networks:
      - dataops-net

  # ─────────────────────────────────────────────────────────────────
  # PostgreSQL (mock Redshift / data warehouse)
  # ─────────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: dataops-postgres
    environment:
      POSTGRES_USER:     dataops
      POSTGRES_PASSWORD: dataops
      POSTGRES_DB:       dataops
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dataops"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - dataops-net

  # ─────────────────────────────────────────────────────────────────
  # HashiCorp Vault (dev mode – local secrets management)
  # ─────────────────────────────────────────────────────────────────
  vault:
    image: hashicorp/vault:1.17
    container_name: dataops-vault
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: root
      VAULT_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
    cap_add:
      - IPC_LOCK
    ports:
      - "8200:8200"
    networks:
      - dataops-net
    command: server -dev

  # ─────────────────────────────────────────────────────────────────
  # Prometheus + Pushgateway
  # ─────────────────────────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:v2.52.0
    container_name: dataops-prometheus
    volumes:
      - ./docker/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    networks:
      - dataops-net

  pushgateway:
    image: prom/pushgateway:v1.9.0
    container_name: dataops-pushgateway
    ports:
      - "9091:9091"
    networks:
      - dataops-net

  # ─────────────────────────────────────────────────────────────────
  # Grafana (dashboards)
  # ─────────────────────────────────────────────────────────────────
  grafana:
    image: grafana/grafana:11.0.0
    container_name: dataops-grafana
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_PATHS_PROVISIONING: /etc/grafana/provisioning
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - dataops-net

volumes:
  postgres_data:
  grafana_data:

networks:
  dataops-net:
    driver: bridge
